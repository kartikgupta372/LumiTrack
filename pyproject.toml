[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fsoc-pat-simulation"
version = "0.1.0"
description = "Clean deterministic Group 1 simulation core for an FSOC coarse-PAT testbed"
readme = "simulation/README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
fsoc-group1-demo = "fsoc_sim.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
